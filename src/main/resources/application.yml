# ---------------------------------------------------------------------------
# Base configuration.
#
# Every value that differs between environments is read from an environment
# variable (with a safe local default where one is harmless). Nothing secret is
# stored in this file - see .env.example for the required variables.
#
# Profiles:
#   (none)  -> PostgreSQL, for real deployments. Requires DB_* and JWT_SECRET.
#   prod    -> production hardening on top of the default profile: the schema
#              is owned by Flyway and Hibernate only validates it (see
#              application-prod.yml).
#   local   -> in-memory/file H2 database so the stack can run without a
#              PostgreSQL server. See application-local.yml.
# ---------------------------------------------------------------------------
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
  # Behind a TLS-terminating reverse proxy set FORWARD_HEADERS_STRATEGY=framework
  # so request URLs, redirects and cookies use https://. Keep `none` when the
  # app is reached directly (never trust client-supplied forwarded headers
  # unless a proxy you control adds them).
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: markethub-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/markethub_db}
    username: ${DB_USERNAME:postgres}
    # No default on purpose: an unset DB_PASSWORD fails startup immediately
    # instead of producing a half-started application.
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: markethub-db
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
  jpa:
    hibernate:
      # `update` keeps an existing database in place while developing; the
      # `prod` profile defaults to `validate` so Hibernate can never mutate a
      # production schema (migrations are Flyway's job).
      ddl-auto: ${JPA_DDL_AUTO:update}
    # SQL logging is noisy and can leak row data into logs: opt in via SHOW_SQL=true.
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # Version-controlled schema migrations (src/main/resources/db/migration).
  # `baseline-on-migrate` adopts databases that were created by Hibernate
  # before Flyway was introduced without replaying V1 against existing tables.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    # `flyway:clean` must never be runnable against a shared database.
    clean-disabled: true

application:
  security:
    jwt:
      # Required, minimum 32 bytes. The application refuses to start without it.
      secret-key: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION_MS:86400000} # 24 hours in milliseconds

# Browser origins allowed to call the API (comma separated, exact match).
# The `prod` profile refuses to start on the localhost default.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Operational endpoints. Only health and info are exposed, unauthenticated,
# so a load balancer / container platform can smoke-test the service:
#   GET /api/v1/actuator/health   -> {"status":"UP"}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Never leak datasource URLs, disk paths or env details to callers.
      show-details: never
      # Adds /actuator/health/liveness and /actuator/health/readiness for
      # Kubernetes-style orchestrators.
      probes:
        enabled: true

logging:
  level:
    # Root stays at INFO; override per environment (see application-prod.yml).
    root: ${LOG_LEVEL_ROOT:INFO}
